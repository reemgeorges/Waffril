# WAFFRLI P0 Foundation (2026-10-30). Standalone spec — kept outside docs/openapi/modules
# because the existing test suite deletes docs/openapi during teardown.
openapi: 3.0.3
info:
  title: 'WAFFRLI — P0 Foundation API'
  version: 0.1.0
  description: 'Generated from the implemented P0 routes (2026-10-30). Envelope: {data, status, error, statusCode}. Send Accept-Language: ar|en.'
servers:
  -
    url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Envelope:
      type: object
      properties:
        data:
          nullable: true
        status:
          type: boolean
        error:
          nullable: true
          type: string
        statusCode:
          type: integer
    TranslatableName:
      type: object
      required:
        - ar
        - en
      properties:
        ar:
          type: string
          maxLength: 150
        en:
          type: string
          maxLength: 150
    IdRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
    SettingCreate:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          pattern: '^[a-z0-9_.]+$'
          maxLength: 100
        value:
          description: 'Any non-null JSON value; non-negative decimal (≤4 dp) when is_monetary'
        is_monetary:
          type: boolean
    SettingUpdate:
      type: object
      required:
        - id
        - value
      properties:
        id:
          type: integer
        value:
          description: 'Any non-null JSON value'
    CurrencyCreate:
      type: object
      required:
        - code
        - name
        - symbol
        - decimals
        - exchange_rate
      properties:
        code:
          type: string
          pattern: '^[A-Za-z]{3}$'
        name:
          $ref: '#/components/schemas/TranslatableName'
        symbol:
          type: string
          maxLength: 10
        decimals:
          type: integer
          minimum: 0
          maximum: 4
        exchange_rate:
          type: string
          description: 'Decimal as string, up to 12 fractional digits'
        is_active:
          type: boolean
    CurrencyUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/TranslatableName'
        symbol:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 4
        exchange_rate:
          type: string
          description: 'Decimal as string, up to 12 fractional digits'
      description: 'code, is_active and is_default are prohibited'
    CityCreate:
      type: object
      required:
        - name
        - center_lat
        - center_lng
        - radius_km
      properties:
        name:
          $ref: '#/components/schemas/TranslatableName'
        center_lat:
          type: number
        center_lng:
          type: number
        radius_km:
          type: number
          exclusiveMinimum: true
          minimum: 0
        sort_order:
          type: integer
        is_active:
          type: boolean
    CityUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/TranslatableName'
        center_lat:
          type: number
        center_lng:
          type: number
        radius_km:
          type: number
        sort_order:
          type: integer
    GeoJsonPolygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: '[lng, lat]'
      description: 'One closed outer ring; holes not supported'
    DeliveryAreaCreate:
      type: object
      required:
        - city_id
        - name
        - boundary
      properties:
        city_id:
          type: integer
        name:
          $ref: '#/components/schemas/TranslatableName'
        boundary:
          $ref: '#/components/schemas/GeoJsonPolygon'
        sort_order:
          type: integer
        is_active:
          type: boolean
    DeliveryAreaUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        city_id:
          type: integer
        name:
          $ref: '#/components/schemas/TranslatableName'
        boundary:
          $ref: '#/components/schemas/GeoJsonPolygon'
        sort_order:
          type: integer
    DeliveryFeeRuleCreate:
      type: object
      required:
        - distance_from_km
        - distance_to_km
        - base_fee
        - per_km_fee
      properties:
        city_id:
          type: integer
          nullable: true
          description: 'null with no area = global scope; required when delivery_area_id is set'
        delivery_area_id:
          type: integer
          nullable: true
        distance_from_km:
          type: number
        distance_to_km:
          type: number
          description: 'Exclusive upper bound, > distance_from_km'
        base_fee:
          type: string
          description: 'Decimal as string, up to 4 fractional digits'
        per_km_fee:
          type: string
          description: 'Decimal as string, up to 4 fractional digits'
        is_active:
          type: boolean
    DeliveryFeeRuleUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        city_id:
          type: integer
          nullable: true
        delivery_area_id:
          type: integer
          nullable: true
        distance_from_km:
          type: number
        distance_to_km:
          type: number
        base_fee:
          type: string
          description: 'Decimal as string, up to 4 fractional digits'
        per_km_fee:
          type: string
          description: 'Decimal as string, up to 4 fractional digits'
    DeliveryQuoteRequest:
      type: object
      required:
        - city_id
        - origin_lat
        - origin_lng
        - destination_lat
        - destination_lng
      properties:
        city_id:
          type: integer
        origin_lat:
          type: number
        origin_lng:
          type: number
        destination_lat:
          type: number
        destination_lng:
          type: number
    DetectCityRequest:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
        lng:
          type: number
