  /api/v1/admin/cities/create:
    post:
      tags:
        - Admin
      operationId: admin.citiesCreate.post
      summary: 'Cities: Create'
      description: |-
        Requires a `admin` token.
        Admin permission: `manage,App\Models\City` policy ability.
        Handler: `City\CityController@store`.
      parameters:
        -
          $ref: '#/components/parameters/AcceptLanguage'
      security:
        -
          adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                center_lat:
                  oneOf:
                    -
                      type: number
                      minimum: -90
                      maximum: 90
                    -
                      type: string
                      format: decimal
                      pattern: '^-?\d+(\.\d+)?$'
                  description: 'number, or a decimal string (money amounts are sent as strings)'
                center_lng:
                  oneOf:
                    -
                      type: number
                      minimum: -180
                      maximum: 180
                    -
                      type: string
                      format: decimal
                      pattern: '^-?\d+(\.\d+)?$'
                  description: 'number, or a decimal string (money amounts are sent as strings)'
                is_active:
                  type: boolean
                name:
                  type: object
                  properties:
                    ar:
                      type: string
                      maxLength: 150
                      description: 'required_with: name'
                    en:
                      type: string
                      maxLength: 150
                      description: 'required_with: name'
                radius_km:
                  oneOf:
                    -
                      type: number
                      maximum: 9999.99
                    -
                      type: string
                      format: decimal
                      pattern: '^-?\d+(\.\d+)?$'
                  description: 'gt: 0; number, or a decimal string (money amounts are sent as strings)'
                sort_order:
                  type: integer
                  minimum: 0
              required:
                - center_lat
                - center_lng
                - name
                - radius_km
            example:
              name:
                ar: 'مدينة اختبار'
                en: 'Bruno City 1793471638861'
              center_lat: 33.51
              center_lng: 36.29
              radius_km: 5
              sort_order: 99
      responses:
        200:
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                data:
                  city:
                    name: 'Bruno City 1793471638861'
                    center_lat: '33.5100000'
                    center_lng: '36.2900000'
                    radius_km: '5.00'
                    is_active: null
                    sort_order: 99
                    id: 6
                    is_deleted: false
                    created_at: '2026-10-31T18:33:58.000000Z'
                    name_translations:
                      ar: 'مدينة اختبار'
                      en: 'Bruno City 1793471638861'
                status: true
                error: null
                statusCode: 200
        400:
          description: 'Create - validation error (real response)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                data: null
                status: false
                error: 'The center lat field must be between -90 and 90.'
                statusCode: 400
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
