components:
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      description: 'Customer token from POST /api/v1/customer/auth/otp/verify (or register / recovery).'
    driverToken:
      type: http
      scheme: bearer
      description: 'Driver token from POST /api/v1/driver/login.'
    adminToken:
      type: http
      scheme: bearer
      description: 'Admin token from POST /api/v1/admin/login.'
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - ar
          - en
      description: 'Response language for labels, messages and errors.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'Required for checkout: a replay with the same key returns the same order.'
  schemas:
    Envelope:
      type: object
      required:
        - data
        - status
        - error
        - statusCode
      properties:
        data:
          description: 'Payload (null on errors).'
        status:
          type: boolean
        error:
          type: string
          nullable: true
        statusCode:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'All validation messages per field (422 validation responses only).'
    ErrorEnvelope:
      type: object
      required:
        - data
        - status
        - error
        - statusCode
      properties:
        data:
          type: object
          nullable: true
          description: 'Always null on errors.'
        status:
          type: boolean
        error:
          type: string
          nullable: true
        statusCode:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'All validation messages per field (422 validation responses only).'
    BroadcastAuth:
      type: object
      required:
        - auth
      properties:
        auth:
          type: string
          description: '`<app key>:<HMAC-SHA256 signature>` for the Pusher protocol (Reverb). Not wrapped in the envelope.'
        channel_data:
          type: string
          description: 'Presence channels only.'
    Ping:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
  responses:
    BadRequest:
      description: 'Validation error (first message in `error`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            status: false
            error: 'The phone field is required.'
            statusCode: 400
    Unauthenticated:
      description: 'Missing, invalid or revoked token.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            status: false
            error: 'Please sign in to continue.'
            statusCode: 401
    Forbidden:
      description: 'Account suspended/inactive, missing permission, or channel not yours.'
      content:
        application/json:
          schema:
