components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - ar
          - en
      description: 'Response language (labels, messages, errors).'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'Required for checkout; a replay returns the same order.'
  schemas:
    Envelope:
      type: object
      required:
        - data
        - status
        - error
        - statusCode
      properties:
        data:
          nullable: true
          description: 'Payload (null on errors).'
        status:
          type: boolean
        error:
          type: string
          nullable: true
          description: 'Localized message on errors.'
        statusCode:
          type: integer
  responses:
    Ok:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BadRequest:
      description: 'Validation error (first message in `error`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthenticated:
      description: 'Missing or revoked token.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Forbidden:
      description: 'Account suspended/inactive or not allowed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NotFound:
      description: 'Not found or not yours.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Conflict:
      description: 'State conflict (e.g. order already accepted, ordering paused).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unprocessable:
      description: 'Business rule violated.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    TooManyRequests:
      description: 'Rate limited.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
