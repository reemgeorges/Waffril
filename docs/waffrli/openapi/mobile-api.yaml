openapi: 3.0.3
info:
  title: 'WAFFRLI Customer and Driver API'
  version: 1.0.0
  description: |-
    Generated from the implemented routes by `php artisan waffrli:api-contract` (do not edit by hand).
    Every response uses the envelope {data, status, error, statusCode}. Machine values (statuses, types) are stable;
    *_label fields and messages follow Accept-Language (ar | en, default APP_LOCALE).
    Executable request/response examples: api-tests/bruno/WAFFRLI-Customer and WAFFRLI-Driver.
servers:
  -
    url: /
    description: 'Same host as the API'
tags:
  -
    name: customer
    description: 'Customer app (Sanctum `user` token from phone OTP)'
  -
    name: driver
    description: 'Driver app (Sanctum `driver` token)'
