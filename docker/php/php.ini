; WAFFRLI local development PHP settings
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
date.timezone = UTC
expose_php = Off
opcache.enable = 1
opcache.enable_cli = 0
; development: pick up code changes immediately
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
