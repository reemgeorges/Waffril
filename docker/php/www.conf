; WAFFRLI local FPM pool (runs as the container user www-data).
[www]
; ignored (with a notice) when FPM already runs as the non-root container user
user = www-data
group = www-data
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
