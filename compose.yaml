# WAFFRLI — local DEVELOPMENT environment (Docker Desktop + WSL2 on Windows).
# Not for production. Every published port binds to 127.0.0.1 only.
#
#   web        Nginx → http://localhost:8080 (API, Filament /admin, docs /docs)
#   app        PHP 8.3 FPM (Laravel)
#   queue      queue worker (Redis) — notifications, push, broadcasts
#   scheduler  Laravel scheduler (schedule:work)
#   reverb     the ONE shared WebSocket server (customers, drivers, Filament) → ws://localhost:8085
#   mysql      MySQL 8.4 (dev database + separate `waffrli_testing` database)
#   redis      cache / sessions / queue (internal only)
#   mailpit    catches all outgoing mail → http://localhost:8025
#   node       one-off asset builds (profile "tools")
#
# Values come from ./.env (copy .env.docker.example; scripts/setup.ps1 does it).

name: waffrli

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  image: waffrli-app:dev
  volumes:
    - ./:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks: [waffrli]

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [waffrli]

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3", "--backoff=10", "--sleep=1", "--max-time=3600"]
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:${REVERB_PUBLIC_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-waffrli}
      MYSQL_USER: ${DB_USERNAME:-waffrli}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:-waffrli_testing}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [waffrli]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [waffrli]

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    networks: [waffrli]

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    profiles: ["tools"]
    networks: [waffrli]

volumes:
  mysql-data:
  redis-data:

networks:
  waffrli:
